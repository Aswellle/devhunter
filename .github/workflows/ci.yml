# CI 门禁：每一次推送与每一个 PR 都在 GitHub 上跑全量验证。
#
# 三道并行检查 + 一个汇总门禁：
#   backend-tests     pytest 全量单测/集成/API 测试（417+，含覆盖率报告）
#   backend-e2e       独立 E2E 冒烟（TestClient 全流程：Auth/Task/Items/Executions/错误处理）
#   frontend-quality  ESLint + TypeScript 编译 + Vite 生产构建
#   gate              汇总：以上任一失败则本推送不合格（可设为分支保护必过项）
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试栈在 pyproject 的 dev extras 里，requirements.txt 不含
          pip install "pytest>=8.1" "pytest-asyncio>=0.23" "pytest-cov>=5.0"

      - name: Run full pytest suite with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

  backend-e2e:
    name: Backend E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 自包含脚本：自带临时 DB 与测试环境变量，失败时 exit 1
      - name: Run E2E smoke
        run: python e2e_test.py

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # tsc -b && vite build：类型错误与构建失败都会在这里挡下
      - name: Production build
        run: npm run build

  gate:
    name: CI Gate
    needs: [backend-tests, backend-e2e, frontend-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate results
        run: |
          echo "backend-tests = ${{ needs.backend-tests.result }}"
          echo "backend-e2e   = ${{ needs.backend-e2e.result }}"
          echo "frontend      = ${{ needs.frontend-quality.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] \
             || [ "${{ needs.backend-e2e.result }}" != "success" ] \
             || [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "::error::CI gate failed"
            exit 1
          fi
          echo "All checks passed"
