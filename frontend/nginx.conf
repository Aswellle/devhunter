server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # S6: 基础安全响应头。这是一个基于 httpOnly Cookie 的认证应用，
    # 缺少这些头会放大 XSS/点击劫持等攻击的影响面。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Vite 生产构建不产生内联 <script>/<style>，故 CSP 不需要
    # 'unsafe-inline'；connect-src 'self' 覆盖本 Nginx 反代的 /api/ 请求。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 请求反向代理到后端
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # S13: 若未来在此 Nginx 层终止 HTTPS，后端需要知道原始协议才能
        # 正确判断 secure cookie 逻辑（settings.is_production 已用于此）。
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查接口
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # 所有其他路由回退到 index.html（SPA 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
