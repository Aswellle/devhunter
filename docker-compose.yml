version: '3.9'

services:
  # ── 后端 API + 调度器 ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devhunter-backend
    restart: unless-stopped
    environment:
      # ⚠️ 生产环境必须通过 .env 文件设置真实值，不提供任何 fallback 默认值。
      # 若 AUTH_PASSWORD 或 SECRET_KEY 为空/占位符，后端启动时会拒绝启动。
      # 使用方式：cp backend/.env.example backend/.env 并填写真实值
      APP_ENV: production
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      JWT_EXPIRE_MINUTES: "10080"
      CRAWLER_TIMEOUT: "15"
      CRAWLER_MAX_RESPONSE_MB: "5"
      SCHEDULER_MAX_WORKERS: "3"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # 数据库必须落在挂载卷内：默认相对路径会写进容器可写层，
      # 容器重建（升级/迁移镜像）即丢失全部数据
      DB_PATH: /data/devhunter.db
      # uvicorn 0.42 默认 forwarded_allow_ips='127.0.0.1'，而 nginx 容器的
      # bridge 地址不是 loopback——不设置此变量时 request.client.host 始终
      # 是 nginx 地址，登录限流和锁定对全部外部调用者共享一个桶。
      # 后端仅 expose 在 Docker 内部网络，此网络上的唯一 peer 就是 nginx。
      FORWARDED_ALLOW_IPS: "*"
      # 浏览器可见的前端 origin；http://frontend 是 Docker 内部服务名，
      # 浏览器永远不会把它当作 Origin 发送，此前留在这里是死配置。
      CORS_ORIGINS: http://localhost,http://localhost:80,https://localhost
    volumes:
      - devhunter_data:/data
    # 生产环境通过内部网络通信，不再映射宿主机端口。
    # 前端 Nginx 通过服务名 backend:8000 反向代理访问后端。
    # 开发环境如需直连 API，使用 docker-compose.dev.yml override。
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── 前端静态文件服务（Nginx）──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devhunter-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  devhunter_data:
    driver: local
